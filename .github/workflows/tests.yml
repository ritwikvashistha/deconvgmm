name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: qualified-cpu-py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Qualified stack only. The beta is validated against jax 0.6.x with
        # numpy 1.26.4 / scipy 1.12.0, whose wheels stop at cp312 -- so the
        # matrix is Python 3.10-3.12. Newer Python forces numpy 2.x / newer jax,
        # which change float32 factorization and fixture bytes and are not yet
        # qualified.
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install qualified dependencies
        run: >-
          python -m pip install
          "numpy==1.26.4"
          "scipy==1.12.0"
          "jax==0.6.2"
          "jaxlib==0.6.2"
          "scikit-learn>=1.3"
          "pytest>=7.4"

      - name: Record resolved environment
        run: python -m pip list

      - name: Run tests
        run: python -m pytest -q

  install-smoke:
    name: install-and-import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Build and install the package
        run: python -m pip install .

      - name: Import from a neutral working directory
        # Run outside the checkout so the source tree's top-level `development/`
        # package cannot mask a packaging bug (this guards the B1-class regression
        # where `import deconvgmm` failed in a real install).
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import deconvgmm;
          import deconvgmm.identity, deconvgmm.general, deconvgmm.convmmd;
          print('deconvgmm', deconvgmm.__version__, 'import OK')"
